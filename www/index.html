<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controller Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #edf0f2;
            color: #263238;
        }

        header {
            background: #263746;
            color: white;
            padding: 22px 35px;
        }

        main {
            width: 340px;
            margin: 90px auto;
            padding: 30px;
            background: white;
            border: 1px solid #d5dadd;
        }

        h1 {
            font-size: 21px;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            font-size: 14px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            border: 1px solid #aeb8bf;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 11px;
            background: #315d78;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #24465c;
        }

        #message {
            color: #b3261e;
            font-size: 14px;
        }

        footer {
            text-align: center;
            color: #65747c;
            font-size: 12px;
            margin-top: 35px;
        }
    </style>
</head>

<body>

    <header>
        <strong>Refrigeration Controller Management</strong>
    </header>

    <main>

        <h1>System Login</h1>

        <p>Sign in to access the controller management system.</p>

        <form action="/login" method="POST">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Sign in</button>

        </form>

        <p id="message"></p>

        <footer>
            Controller Management System
        </footer>

    </main>

    <script>
        const parameters = new URLSearchParams(
            window.location.search
        );

        if (parameters.has("error")) {
            document.getElementById("message").textContent =
                "Authentication failed. Please check your credentials.";
        }
    </script>

</body>
</html>
